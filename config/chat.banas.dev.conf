# Independent virtual host. Do not replace any existing site's configuration.
map $http_upgrade $chat_connection_upgrade {
    default upgrade;
    '' close;
}
map "$request_method:$http_origin" $chat_bad_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^(POST|PUT|PATCH|DELETE):https://chat\.banas\.dev$ 0;
}
limit_req_zone $binary_remote_addr zone=chat_login:1m rate=5r/m;
map $request_method $chat_write_key {
    default '';
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $chat_write_key zone=chat_mutations:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.banas.dev;
    return 301 https://chat.banas.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.banas.dev;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    error_log /var/log/nginx/private-chat-error.log warn;
    include /etc/nginx/snippets/private-chat-cloudflare.conf;
    if ($chat_bad_origin) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://chat.banas.dev; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control no-store always;

    location = /api/v1/auths/signup { return 403; }
    location ^~ /s/ { return 403; }
    location = /api/v1/auths/signin {
        limit_req zone=chat_login burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/private-chat-proxy.conf;
    }
    location ^~ /api/ {
        # Public conversation links are intentionally unavailable in this private deployment.
        location ~ ^/api/v1/chats/(share/|shared(?:/|$)|[^/]+/share(?:/|$)) { return 403; }
        limit_req zone=chat_mutations burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/private-chat-proxy.conf;
    }
    location = /banas-brand.css {
        alias /opt/private-chat/assets/brand.css;
        default_type text/css;
    }
    location ~ ^/(static/)?(favicon.*\.(png|ico|svg)|apple-touch-icon\.png|splash\.png)$ {
        alias /opt/private-chat/assets/icon.svg;
        types { }
        default_type image/svg+xml;
    }
    location / {
        include /etc/nginx/snippets/private-chat-proxy.conf;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/banas-brand.css"></head>';
    }
}
