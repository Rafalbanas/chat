proxy_pass http://127.0.0.1:18084;
proxy_http_version 1.1;
proxy_set_header Host chat.banas.dev;
proxy_set_header X-Forwarded-Host chat.banas.dev;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $chat_connection_upgrade;
# Never accept identity assertions from a public client.
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Name "";
proxy_set_header X-OpenWebUI-User-Name "";
proxy_set_header X-OpenWebUI-User-Email "";
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
proxy_connect_timeout 5s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
